'use strict';
/* ============================================================
   FOOD FRENZY — a 2-4 player tabletop food party game
   Single file, canvas only, no external assets.
   Dev hook: window.__ff  (step frames, force modes, inspect)
   ============================================================ */

//------------------------------------------------ basics
const W=1280,H=720,TAU=Math.PI*2;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const choice=arr=>arr[Math.floor(Math.random()*arr.length)];
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randi(0,i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}

// table area (top strip is HUD)
const T={x:90,y:112,w:1100,h:528};
const CX=T.x+T.w/2, CY=T.y+T.h/2;

//------------------------------------------------ audio (all generated)
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f,dur,type,vol,slide){const a=ac();if(!a)return;try{
 const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,a.currentTime);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+dur);
 g.gain.setValueAtTime(vol||0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}catch(e){}}
function noiseHit(dur,vol,lp){const a=ac();if(!a)return;try{
 const n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();g.gain.value=vol;
 const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||900;
 src.connect(f);f.connect(g);g.connect(a.destination);src.start();}catch(e){}}
const SFX={
 ui(){beep(660,0.06,'square',0.09);},
 join(){beep(440,0.08,'square',0.1);beep(660,0.1,'square',0.1);},
 bump(){beep(130,0.07,'square',0.11,-50);},
 poof(){beep(320,0.28,'sawtooth',0.15,-260);noiseHit(0.2,0.12,700);},
 splat(){noiseHit(0.25,0.2,500);beep(180,0.15,'sine',0.12,-120);},
 shoot(){beep(560,0.14,'square',0.12,-380);},
 boom(){beep(85,0.4,'sawtooth',0.2,-55);noiseHit(0.35,0.25,400);},
 pickup(){beep(700,0.07,'sine',0.12);beep(1050,0.09,'sine',0.1);},
 pass(){beep(500,0.06,'square',0.12,300);},
 tick(){beep(1100,0.04,'square',0.06);},
 paint(){beep(rand(420,560),0.05,'sine',0.07);},
 fall(){beep(500,0.4,'sine',0.1,-420);},
 spawn(){beep(240,0.08,'triangle',0.1,120);},
};
function jingle(){[523,659,784,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'square',0.13),i*120));}

// online host mirrors every sound effect to clients
for(const k of Object.keys(SFX)){const orig=SFX[k];
 SFX[k]=function(){orig();if(net&&net.role==='host'&&netFx.sfx.length<10)netFx.sfx.push(k);};}

//------------------------------------------------ music (two original themes, fully generated)
const music={name:null,step:0,nextT:0,out:null,notes:0};
let noiseB=null;
function noiseBuf(a){if(!noiseB){noiseB=a.createBuffer(1,(a.sampleRate*0.4)|0,a.sampleRate);
 const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseB;}
function musicOut(){const a=AC;if(!a)return null;
 if(!music.out){
  music.out=a.createGain();music.out.gain.value=0.34;music.out.connect(a.destination);
  const dl=a.createDelay(0.6);dl.delayTime.value=0.26;
  const fb=a.createGain();fb.gain.value=0.22;
  const wet=a.createGain();wet.gain.value=0.15;
  music.out.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(a.destination);}
 return music.out;}
// note data: roots/chords per bar (MIDI); lead = per-bar [stepInBar, midi, lengthInSteps]
const SONGS={
 menu:{bpm:116,swing:0.55,bars:8,
  roots:[41,38,34,36,41,38,43,36], // F Dm Bb C | F Dm Gm C
  chords:[[65,69,72],[62,65,69],[58,62,65],[60,64,67],[65,69,72],[62,65,69],[55,58,62],[60,64,70]],
  bassPat:[[0,0,3],[4,7,2],[8,0,2],[11,12,1],[13,0,2]],
  arpPat:[0,1,2,3,2,1,2,1],arpVol:0.12,pad:true,stabs:null,hat16:false,
  kick:[0,8,11],snare:[4,12],ohat:[14],
  lead:[
   [[0,69,3],[4,72,2],[6,69,1],[8,74,4],[14,72,2]],
   [[0,74,2],[2,72,1],[4,69,2],[8,67,3],[12,65,3]],
   [[0,70,3],[4,74,2],[6,72,1],[8,77,4],[14,74,1]],
   [[0,76,2],[2,74,1],[4,72,2],[8,67,3],[12,72,2]],
   [[0,69,3],[4,72,2],[6,69,1],[8,74,4],[14,72,2]],
   [[0,74,2],[2,76,1],[4,77,2],[8,74,3],[12,72,2]],
   [[0,70,2],[2,72,1],[4,74,2],[8,72,2],[12,70,2]],
   [[0,69,3],[4,70,1],[6,69,1],[8,67,4],[12,64,2]],
  ]},
 game:{bpm:132,swing:0.5,bars:8,
  roots:[38,38,41,43,38,38,34,33], // Dm Dm F G | Dm Dm Bb A
  chords:[[62,65,69],[62,65,69],[65,69,72],[67,71,74],[62,65,69],[62,65,69],[58,62,65],[57,61,64]],
  bassPat:[[0,0,1.6],[2,0,1.6],[4,12,1.6],[6,0,1.6],[8,0,1.6],[10,7,1.6],[12,12,1.6],[14,0,1.6]],
  arpPat:[0,1,2,3,0,2,1,3],arpVol:0.1,pad:false,stabs:[7,15],hat16:true,
  kick:[0,6,8,12],snare:[4,12],ohat:[14],
  lead:[
   [[0,74,1],[2,77,1],[4,81,2],[7,79,1],[8,77,1],[10,76,1],[12,74,2]],
   [[0,72,1],[2,74,1],[4,77,2],[8,74,3],[12,72,1],[14,70,1]],
   [[0,69,1],[2,72,1],[4,77,2],[7,76,1],[8,77,1],[10,79,1],[12,81,2]],
   [[0,79,2],[4,74,2],[8,76,2],[12,79,2]],
   [[0,74,1],[2,77,1],[4,81,2],[7,79,1],[8,77,1],[10,76,1],[12,74,2]],
   [[0,72,1],[2,74,1],[4,77,2],[8,79,3],[12,81,2]],
   [[0,77,2],[4,74,2],[8,70,2],[12,74,2]],
   [[0,76,2],[4,73,2],[8,69,3],[12,73,1],[14,76,1]],
  ]},
};
function mnote(t,midi,dur,kind,vol){
 const a=AC,out=musicOut();if(!a||!out)return;
 try{
  const f=440*Math.pow(2,(midi-69)/12);
  const g=a.createGain();g.connect(out);
  const flt=a.createBiquadFilter();flt.connect(g);
  const oscs=[];let atk=0.012;
  if(kind==='lead'){ // detuned dual saw with a filter sweep — plump, not chippy
   flt.type='lowpass';flt.Q.value=1.1;
   flt.frequency.setValueAtTime(2800,t);flt.frequency.exponentialRampToValueAtTime(750,t+Math.max(0.12,dur));
   for(const d of[-7,7]){const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;o.connect(flt);oscs.push(o);}
   vol*=0.55;}
  else if(kind==='bass'){flt.type='lowpass';flt.frequency.value=480;
   const o=a.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(flt);oscs.push(o);
   const o2=a.createOscillator();o2.type='sine';o2.frequency.value=f;o2.connect(flt);oscs.push(o2);vol*=0.55;}
  else if(kind==='pad'){atk=0.3;flt.type='lowpass';flt.frequency.value=850;
   for(const d of[-4,4]){const o=a.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=d;o.connect(flt);oscs.push(o);}}
  else{ // pluck
   flt.type='lowpass';flt.Q.value=1.4;
   flt.frequency.setValueAtTime(2300,t);flt.frequency.exponentialRampToValueAtTime(480,t+Math.min(0.18,dur));
   const o=a.createOscillator();o.type='square';o.frequency.value=f;o.connect(flt);oscs.push(o);}
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+atk);
  g.gain.setValueAtTime(vol,t+Math.max(atk,dur*0.62));
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur+0.06);
  for(const o of oscs){o.start(t);o.stop(t+dur+0.1);}
  music.notes++;
 }catch(e){}}
function drumKick(t){const a=AC,out=musicOut();if(!a||!out)return;try{
 const o=a.createOscillator(),g=a.createGain();o.type='sine';
 o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(42,t+0.11);
 g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
 o.connect(g);g.connect(out);o.start(t);o.stop(t+0.2);music.notes++;}catch(e){}}
function drumSnare(t){const a=AC,out=musicOut();if(!a||!out)return;try{
 const src=a.createBufferSource();src.buffer=noiseBuf(a);
 const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=0.7;
 const g=a.createGain();g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
 src.connect(f);f.connect(g);g.connect(out);src.start(t);src.stop(t+0.13);
 const o=a.createOscillator(),g2=a.createGain();o.type='triangle';o.frequency.value=185;
 g2.gain.setValueAtTime(0.14,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.07);
 o.connect(g2);g2.connect(out);o.start(t);o.stop(t+0.09);music.notes++;}catch(e){}}
function drumHat(t,open,vol){const a=AC,out=musicOut();if(!a||!out)return;try{
 const src=a.createBufferSource();src.buffer=noiseBuf(a);
 const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=7600;
 const g=a.createGain();const d=open?0.22:0.045;
 g.gain.setValueAtTime(vol*0.15,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
 src.connect(f);f.connect(g);g.connect(out);src.start(t);src.stop(t+d+0.02);music.notes++;}catch(e){}}
function scheduleStep(song,step,t){
 const bar=Math.floor(step/16),s=step%16,spb=60/song.bpm/4;
 if(song.kick.includes(s))drumKick(t);
 if(song.snare.includes(s))drumSnare(t);
 if(song.ohat.includes(s))drumHat(t,true,0.7);
 else if(s%2===0)drumHat(t,false,s%4===0?0.75:0.45);
 else if(song.hat16)drumHat(t,false,0.22);
 const root=song.roots[bar],tones=song.chords[bar];
 for(const b of song.bassPat)if(b[0]===s)mnote(t,root+b[1],b[2]*spb,'bass',0.5);
 if(s%2===0){const ai=song.arpPat[s/2];
  mnote(t,tones[ai%3]+(ai>2?12:0),spb*1.7,'pluck',song.arpVol);}
 if(song.pad&&s===0)for(const tn of tones)mnote(t,tn,spb*15,'pad',0.045);
 if(song.stabs&&song.stabs.includes(s))for(const tn of tones)mnote(t,tn+12,spb*1.2,'pluck',0.07);
 for(const n of song.lead[bar])if(n[0]===s)mnote(t,n[1],n[2]*spb*0.95,'lead',0.2);
}
function musicPlay(name){
 if(music.name===name)return;
 music.name=name;music.step=0;
 if(AC)music.nextT=AC.currentTime+0.08;
}
setInterval(()=>{ // lookahead scheduler
 if(!music.name||SAVE.music===false||!AC)return;
 const a=AC,song=SONGS[music.name],spb=60/song.bpm/4;
 if(!musicOut())return;
 if(music.nextT<a.currentTime)music.nextT=a.currentTime+0.03;
 while(music.nextT<a.currentTime+0.15){
  scheduleStep(song,music.step,music.nextT);
  music.nextT+=spb*2*(music.step%2===0?song.swing:1-song.swing);
  music.step=(music.step+1)%(song.bars*16);
 }
},40);

//------------------------------------------------ input
const keys={},keyEdge={};
addEventListener('keydown',e=>{
 if(!keys[e.code])keyEdge[e.code]=true;
 keys[e.code]=true;ac();
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Numpad8','Numpad5','Numpad4','Numpad6'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
const KEYMAPS=[
 {u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD',label:'WASD'},
 {u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight',label:'ARROWS'},
 {u:'KeyI',d:'KeyK',l:'KeyJ',r:'KeyL',label:'IJKL'},
 {u:'Numpad8',d:'Numpad5',l:'Numpad4',r:'Numpad6',label:'NUMPAD 8456'},
];
// pads are polled ONCE per frame; edges are consistent everywhere that frame
let padNow=[{},{},{},{}],padWas=[{},{},{},{}],axNow=[{},{},{},{}],axWas=[{},{},{},{}];
function pads(){return (navigator.getGamepads?navigator.getGamepads():[])||[];}
function pollPads(){
 const gps=pads();
 for(let i=0;i<4;i++){
  padWas[i]=padNow[i];padNow[i]={};
  axWas[i]=axNow[i];axNow[i]={};
  const gp=gps[i];if(!gp)continue;
  for(let b=0;b<Math.min(gp.buttons.length,17);b++)if(gp.buttons[b]&&gp.buttons[b].pressed)padNow[i][b]=true;
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-0.55)axNow[i].l=true;if(ax>0.55)axNow[i].r=true;
  if(ay<-0.55)axNow[i].u=true;if(ay>0.55)axNow[i].d=true;
 }
}
function padBtnEdge(pi,b){return !!padNow[pi][b]&&!padWas[pi][b];}
function padAnyEdge(b){for(let i=0;i<4;i++)if(padBtnEdge(i,b))return true;return false;}
function padDirEdge(pi,dir){ // dpad or stick flick: dir in l/r/u/d
 const dp={l:14,r:15,u:12,d:13}[dir];
 return padBtnEdge(pi,dp)||(!!axNow[pi][dir]&&!axWas[pi][dir]);
}
function padAnyDirEdge(dir){for(let i=0;i<4;i++)if(padDirEdge(i,dir))return true;return false;}
function anyPadConfirm(){return padAnyEdge(0)||padAnyEdge(9);} // A or Start
function anyPadBack(){return padAnyEdge(1);}                    // B
function seatInput(i){
 let x=0,y=0;const m=KEYMAPS[i];
 if(keys[m.l])x--;if(keys[m.r])x++;if(keys[m.u])y--;if(keys[m.d])y++;
 const s=seats[i];
 if(s.pad!=null){const gp=pads()[s.pad];
  if(gp){const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
   if(Math.hypot(ax,ay)>0.25){x+=ax;y+=ay;}
   if(gp.buttons[14]&&gp.buttons[14].pressed)x--;if(gp.buttons[15]&&gp.buttons[15].pressed)x++;
   if(gp.buttons[12]&&gp.buttons[12].pressed)y--;if(gp.buttons[13]&&gp.buttons[13].pressed)y++;}}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}
 return {x,y};
}
function localInput(){ // ANY local control scheme — used for your own player when online
 let x=0,y=0;
 for(const m of KEYMAPS){if(keys[m.l])x--;if(keys[m.r])x++;if(keys[m.u])y--;if(keys[m.d])y++;}
 for(const gp of pads()){if(!gp)continue;
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(Math.hypot(ax,ay)>0.25){x+=ax;y+=ay;}
  const pn=padNow[gp.index]||{};
  if(pn[14])x--;if(pn[15])x++;if(pn[12])y--;if(pn[13])y++;}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}
 return {x,y};
}
function getPlayerInput(p){
 if(p.bot)return p.botInput;
 if(net&&net.role==='host')return p.seat===0?localInput():(net.inputs[p.seat]||{x:0,y:0});
 return seatInput(p.seat);
}
const mouse={x:0,y:0,click:false};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();
 mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;mouse.click=true;ac();});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();

//------------------------------------------------ save / unlocks / achievements

 {id:'match',name:'Full Course',desc:'Win a match',test:()=>SAVE.matchWins>=1},

function checkUnlocks(){
 while(SAVE.unlockCount<CHARS.length-6&&SAVE.roundWins>=(SAVE.unlockCount+1)*3){
  SAVE.unlockCount++;const c=CHARS[5+SAVE.unlockCount];
  toast('🎉 Unlocked: '+c.name+'!');save();
 }
}
function charUnlocked(i){return i<6||i-6<SAVE.unlockCount;}

function drawBody(kind,r){
 switch(kind){

function drawFace(r,face,t,lookX,lookY){
 const ex=r*0.34,ey=-r*0.12,er=r*0.24;
 const px=clamp(lookX||0,-1,1)*er*0.35,py=clamp(lookY||0,-1,1)*er*0.35;
 ctx.lineWidth=Math.max(2,r*0.09);ctx.lineCap='round';
 if(face==='dead'){
  ctx.strokeStyle='#222';
  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*ex-er*0.6,ey-er*0.6);ctx.lineTo(s*ex+er*0.6,ey+er*0.6);
   ctx.moveTo(s*ex+er*0.6,ey-er*0.6);ctx.lineTo(s*ex-er*0.6,ey+er*0.6);ctx.stroke();}
  ctx.strokeStyle='#222';ctx.beginPath();ctx.arc(0,r*0.62,r*0.3,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  ctx.fillStyle='#6fc3f7';circle(-ex-er*0.4,ey+er+((t*90)%(r*0.9)),r*0.1,'#6fc3f7');circle(ex+er*0.4,ey+er+((t*90+20)%(r*0.9)),r*0.1,'#6fc3f7');
  return;}
 const blink=face==='idle'&&(Math.sin(t*1.7+r)>0.985);
 for(const s of[-1,1]){
  if(blink){ctx.strokeStyle='#222';ctx.beginPath();ctx.moveTo(s*ex-er*0.5,ey);ctx.lineTo(s*ex+er*0.5,ey);ctx.stroke();continue;}
  const sc=face==='panic'?1.25:(face==='smug'?0.95:1);
  circle(s*ex,ey,er*sc,'#fff');
  if(face==='smug'){ctx.fillStyle='#fff';ctx.strokeStyle='#222';
   ctx.beginPath();ctx.moveTo(s*ex-er,ey-er*0.55);ctx.lineTo(s*ex+er,ey-er*0.15);ctx.stroke();}
  if(face==='angry'){ctx.strokeStyle='#222';
   ctx.beginPath();ctx.moveTo(s*ex-s*er,ey-er*1.1);ctx.lineTo(s*ex+s*er*0.4,ey-er*0.5);ctx.stroke();}
  const pr=face==='panic'?er*0.3:er*0.48;
  circle(s*ex+px,ey+py,pr,'#222');
  circle(s*ex+px-pr*0.3,ey+py-pr*0.3,pr*0.32,'#fff');
 }
 ctx.strokeStyle='#222';
 if(face==='panic'){circle(0,r*0.5,r*0.22,'#42210b');circle(0,r*0.46,r*0.13,'#7a3b2e');}
 else if(face==='smug'){ctx.beginPath();ctx.arc(-r*0.08,r*0.42,r*0.3,-0.3,Math.PI*0.55);ctx.stroke();}
 else if(face==='angry'){ctx.beginPath();ctx.arc(0,r*0.75,r*0.28,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
 else{ctx.beginPath();ctx.arc(0,r*0.32,r*0.32,0.25,Math.PI-0.25);ctx.stroke();}
}
function drawChar(kind,x,y,r,face,pcol,t,sqx,sqy,dir,lookX,lookY){
 ctx.save();ctx.translate(x,y);
 if(sqx!==1||sqy!==1){ctx.rotate(dir);ctx.scale(sqx,sqy);ctx.rotate(-dir);}
 if(pcol){ctx.strokeStyle=pcol;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r+3,0,TAU);ctx.stroke();}
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(2,r*0.7,r*0.9,r*0.35,0,0,TAU);ctx.fill();
 drawBody(kind,r);
 drawFace(r,face,t,lookX,lookY);
 ctx.restore();
}

//------------------------------------------------ juice: particles / effects / shake / toasts
let particles=[],effects=[],toasts=[],confetti=[];
let shakeAmt=0;
// effects go through here so the online host can replicate them to clients
function addEffect(e){effects.push(e);
 if(net&&net.role==='host'&&netFx.fx.length<24){const c=Object.assign({},e);delete c.t;netFx.fx.push(c);}}
function shake(a){shakeAmt=Math.min(16,shakeAmt+a);}
function puff(x,y,n,col,spd){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(20,spd||120);
 particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),max:0.7,size:rand(4,10),col:col||'#eee'});}}
function toast(txt){toasts.push({txt,t:4});}
function updateFx(dt){
 particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;return p.life>0;});
 effects=effects.filter(e=>{e.t+=dt;return e.t<e.dur;});
 toasts=toasts.filter(o=>{o.t-=dt;return o.t>0;});
 confetti=confetti.filter(c=>{c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=260*dt;c.rot+=c.vr*dt;return c.y<H+20;});
 shakeAmt*=Math.pow(0.0018,dt);if(shakeAmt<0.15)shakeAmt=0;
}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,p.size*(p.life/p.max+0.3),p.col);}ctx.globalAlpha=1;}
function drawEffects(t){for(const e of effects){
 if(e.type==='fall'){const k=1-e.t/e.dur;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.t*7);ctx.scale(k,k);ctx.translate(-e.x,-e.y);
  drawChar(e.kind,e.x,e.y,19,'dead',e.pcol,t,1,1,0,0,0);ctx.restore();}
 else if(e.type==='cry'){ctx.globalAlpha=1-e.t/e.dur;drawChar(e.kind,e.x,e.y-e.t*30,19,'dead',e.pcol,t,1,1,0,0,0);ctx.globalAlpha=1;}
 else if(e.type==='ring'){const k=e.t/e.dur;ctx.globalAlpha=1-k;ctx.strokeStyle=e.col||'#fff';ctx.lineWidth=5*(1-k);
  ctx.beginPath();ctx.arc(e.x,e.y,20+k*e.r,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
 else if(e.type==='text'){const k=e.t/e.dur;ctx.globalAlpha=1-k;ctx.fillStyle=e.col||'#fff';
  ctx.font='bold 26px "Comic Sans MS",sans-serif';ctx.textAlign='center';ctx.fillText(e.txt,e.x,e.y-k*40);ctx.globalAlpha=1;}
}}
function drawToasts(){let y=64;for(const o of toasts){

function burstConfetti(){for(let i=0;i<160;i++)confetti.push({x:rand(0,W),y:rand(-300,-10),vx:rand(-40,40),vy:rand(30,140),

function wtext(txt,x,y,size,col,t,outline){
 ctx.font='bold '+size+'px "Comic Sans MS","Chalkboard SE",sans-serif';ctx.textAlign='left';
 const total=ctx.measureText(txt).width;let cx0=x-total/2;
 for(let i=0;i<txt.length;i++){const ch=txt[i];const cw=ctx.measureText(ch).width;
  const oy=Math.sin(t*4.2+i*0.9)*size*0.07;const rot=Math.sin(t*3.1+i*1.3)*0.05;
  ctx.save();ctx.translate(cx0+cw/2,y+oy);ctx.rotate(rot);
  if(outline){ctx.lineWidth=size*0.16;ctx.strokeStyle=outline;ctx.strokeText(ch,-cw/2,0);}
  ctx.fillStyle=Array.isArray(col)?col[i%col.length]:col;ctx.fillText(ch,-cw/2,0);
  ctx.restore();cx0+=cw;}
 ctx.textAlign='left';
}

//------------------------------------------------ seats & match
const seats=[
 {type:'human',char:0,pad:null},
 {type:'bot',char:1,pad:null},
 {type:'bot',char:2,pad:null},
 {type:'bot',char:3,pad:null},
];
addEventListener('gamepadconnected',e=>{
 if(net)return; // online seats are managed by the lobby
 const i=e.gamepad.index;
 for(const s of seats)if(s.pad===i)return;
 for(const s of seats){if(s.type!=='human'){s.type='human';s.pad=i;s.char=firstFreeChar();toast('🎮 Gamepad joined!');SFX.join();return;}}
});
function firstFreeChar(){for(let i=0;i<CHARS.length;i++){if(charUnlocked(i)&&!seats.some(s=>s.type==='human'&&s.char===i))return i;}return 0;}
const match={winsNeeded:10,enabled:{},lastMode:null};

//------------------------------------------------ game state
const G={screen:'title',players:[],obstacles:[],arena:null,mode:null,ms:null,time:0,
 cardT:0,scoreT:0,phase:'play',roundWinners:[],victor:null,tGlobal:0};

// physics tuning — the core feel
// while steering: vmax = ACC/FRICT_DRIVE ≈ 321 px/s, ~86% of top speed in ~0.45s
// while coasting: light friction ⇒ long slippery slides and drifty turns
const ACC=1350,FRICT_DRIVE=4.2,FRICT_COAST=1.7,PR=19;

function makePlayer(seatIdx){
 const s=seats[seatIdx];
 return {seat:seatIdx,char:s.type==='bot'?randBotChar():s.char,bot:s.type==='bot',
  skill:rand(0.4,0.9),x:0,y:0,vx:0,vy:0,r:PR,alive:true,wins:0,face:'idle',
  trail:[],dir:0,sqx:1,sqy:1,botInput:{x:0,y:0},botT:rand(0,0.3),botGoal:null,
  meter:0,fireCd:0,bombT:0,ball:null,lookX:0,lookY:0};
}
let usedChars=[];
function randBotChar(){
 let opts=[];for(let i=0;i<CHARS.length;i++)if(charUnlocked(i)&&!usedChars.includes(i))opts.push(i);
 if(!opts.length)for(let i=0;i<CHARS.length;i++)if(charUnlocked(i))opts.push(i);
 const c=choice(opts);usedChars.push(c);return c;}
function startMatch(){
 G.players=[];
 usedChars=seats.filter(s=>s.type==='human').map(s=>s.char);
 for(let i=0;i<4;i++)if(seats[i].type!=='off')G.players.push(makePlayer(i));
 for(const p of G.players)p.wins=0;
 match.lastMode=null;
 startRound();
}

const OBK={ // obstacle kinds
 bowl:{shape:'circle',r:40},burrito:{shape:'rect',w:120,h:44},sombrero:{shape:'circle',r:26,push:true},
 dish:{shape:'circle',r:36},sushi:{shape:'circle',r:22,push:true},

function spotList(){
 return shuffle([
  {x:CX-230,y:CY-115},{x:CX+230,y:CY-115},{x:CX-230,y:CY+115},{x:CX+230,y:CY+115},
  {x:CX,y:CY-165},{x:CX,y:CY+165},{x:CX-350,y:CY},{x:CX+350,y:CY}]);
}
function buildObstacles(arena,mode){
 G.obstacles=[];
 if(mode.barren)return;
 const spots=spotList();
 let use=!!arena.solids;
 if(mode.obsChance!=null)use=use&&Math.random()<mode.obsChance;
 if(mode.id==='ketchup'){
  // center bottle + guaranteed ring of pushable cover
  G.obstacles.push(mkObs('bottle',CX,CY,false));
  const pk=(arena.pushables&&arena.pushables[0])?arena.pushables[0].k:'sushi';
  for(let i=0;i<5;i++){const a=i*TAU/5+rand(0,0.6);
   G.obstacles.push(mkObs(pk,CX+Math.cos(a)*175,CY+Math.sin(a)*140,true));}
  return;
 }
 if(!use)return;
 for(const s of(arena.solids||[])){const sp=spots.pop();if(sp)G.obstacles.push(mkObs(s.k,sp.x+rand(-20,20),sp.y+rand(-16,16),false));}
 for(const s of(arena.pushables||[])){const sp=spots.pop();if(sp)G.obstacles.push(mkObs(s.k,sp.x+rand(-20,20),sp.y+rand(-16,16),true));}

function updatePlayerPhysics(p,dt){
 const inp=getPlayerInput(p);
 let acc=ACC;
 if(G.mode&&G.mode.speedFactor)acc*=G.mode.speedFactor(p);
 p.vx+=inp.x*acc*dt;p.vy+=inp.y*acc*dt;
 const fr=Math.hypot(inp.x,inp.y)>0.05?FRICT_DRIVE:FRICT_COAST;
 const f=Math.exp(-fr*dt);p.vx*=f;p.vy*=f;
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 const sp=Math.hypot(p.vx,p.vy);
 if(sp>20)p.dir=Math.atan2(p.vy,p.vx);
 p.lookX=lerp(p.lookX,sp>10?p.vx/380:0,0.15);p.lookY=lerp(p.lookY,sp>10?p.vy/380:0,0.15);
 // squash & stretch with velocity (subtle)
 const k=Math.min(sp/2400,0.07);p.sqx=lerp(p.sqx,1+k,0.25);p.sqy=lerp(p.sqy,1-k,0.25);
 // trail
 p.trail.push({x:p.x,y:p.y});if(p.trail.length>13)p.trail.shift();
 // edges
 const edge=G.mode?G.mode.edge:'wall';
 if(edge==='wall'){
  if(p.x<T.x+p.r){p.x=T.x+p.r;p.vx=Math.abs(p.vx)*0.35;}
  if(p.x>T.x+T.w-p.r){p.x=T.x+T.w-p.r;p.vx=-Math.abs(p.vx)*0.35;}
  if(p.y<T.y+p.r){p.y=T.y+p.r;p.vy=Math.abs(p.vy)*0.35;}
  if(p.y>T.y+T.h-p.r){p.y=T.y+T.h-p.r;p.vy=-Math.abs(p.vy)*0.35;}
 }else{
  if(p.x<T.x-6||p.x>T.x+T.w+6||p.y<T.y-6||p.y>T.y+T.h+6)eliminate(p,'fall');
 }
}
function bumpPlayers(a,b){
 const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);const min=a.r+b.r;
 if(d>=min||d===0)return;
 const nx=dx/d,ny=dy/d,ov=(min-d)/2;
 a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
 const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
 if(vn<0){
  const J=-vn*1.4+45; // super-elastic + flat shove: ramming really launches people
  a.vx-=nx*J;a.vy-=ny*J;b.vx+=nx*J;b.vy+=ny*J;
  const imp=-vn;
  if(imp>70){SFX.bump();shake(Math.min(5,imp/110));
   a.sqx=b.sqx=0.9;puff((a.x+b.x)/2,(a.y+b.y)/2,4,'#fff8',60);}
  if(G.mode&&G.mode.onBump)G.mode.onBump(a,b,imp);
 }
}
function collideSolidCircle(p,o){
 const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy),min=p.r+o.r;
 if(d>=min||d===0)return false;
 const nx=dx/d,ny=dy/d;p.x=o.x+nx*min;p.y=o.y+ny*min;
 const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=nx*vn*1.3;p.vy-=ny*vn*1.3;}
 return true;
}
function collideSolidRect(p,o){
 const hx=o.w/2,hy=o.h/2;
 const cx=clamp(p.x,o.x-hx,o.x+hx),cy=clamp(p.y,o.y-hy,o.y+hy);
 const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
 if(d>=p.r)return false;
 if(d===0){p.y=o.y-hy-p.r;return true;}
 const nx=dx/d,ny=dy/d,push=p.r-d;
 p.x+=nx*push;p.y+=ny*push;
 const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=nx*vn*1.3;p.vy-=ny*vn*1.3;}
 return true;
}
function collidePushable(p,o){
 const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy),min=p.r+o.r;
 if(d>=min||d===0)return;
 const nx=dx/d,ny=dy/d,ov=min-d;
 o.x+=nx*ov*0.75;o.y+=ny*ov*0.75;p.x-=nx*ov*0.25;p.y-=ny*ov*0.25;
 const rvx=p.vx-o.vx,rvy=p.vy-o.vy,vn=rvx*nx+rvy*ny;
 if(vn>0){o.vx+=nx*vn*0.85;o.vy+=ny*vn*0.85;p.vx-=nx*vn*0.5;p.vy-=ny*vn*0.5;}
}
function updateObstacles(dt){
 for(const o of G.obstacles){
  if(!o.push)continue;
  const f=Math.exp(-3.6*dt);o.vx*=f;o.vy*=f;
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  // keep pushables on the table
  if(o.x<T.x+o.r){o.x=T.x+o.r;o.vx=Math.abs(o.vx)*0.4;}
  if(o.x>T.x+T.w-o.r){o.x=T.x+T.w-o.r;o.vx=-Math.abs(o.vx)*0.4;}
  if(o.y<T.y+o.r){o.y=T.y+o.r;o.vy=Math.abs(o.vy)*0.4;}
  if(o.y>T.y+T.h-o.r){o.y=T.y+T.h-o.r;o.vy=-Math.abs(o.vy)*0.4;}
  // pushable vs pushable / solid
  for(const q of G.obstacles){if(q===o)continue;
   const dx=o.x-q.x,dy=o.y-q.y,d=Math.hypot(dx,dy),min=o.r+q.r;
   if(d<min&&d>0){const nx=dx/d,ny=dy/d,ov=min-d;
    if(q.push){o.x+=nx*ov/2;o.y+=ny*ov/2;q.x-=nx*ov/2;q.y-=ny*ov/2;}
    else{o.x+=nx*ov;o.y+=ny*ov;const vn=o.vx*nx+o.vy*ny;if(vn<0){o.vx-=nx*vn*1.3;o.vy-=ny*vn*1.3;}}}}
 }
 for(const p of alivePlayers()){
  for(const o of G.obstacles){
   if(o.push)collidePushable(p,o);
   else if(o.shape==='rect')collideSolidRect(p,o);
   else collideSolidCircle(p,o);
  }
 }
}

function hazardsNow(){return (G.mode&&G.mode.hazards)?G.mode.hazards():[];}
function safestPoint(p,hz){
 let best=null,bs=-1e9;
 for(let i=0;i<12;i++){
  const q={x:rand(T.x+70,T.x+T.w-70),y:rand(T.y+70,T.y+T.h-70)};
  let s=-dist(p,q)*0.5;
  for(const h of hz){const d=dist(q,h)-(h.r||20);s+=clamp(d,0,260);}
  if(s>bs){bs=s;best=q;}
 }
 return best;
}
function botThink(p,dt){
 p.botT-=dt;
 if(p.botT>0)return;
 p.botT=0.12+(0.9-p.skill)*0.4+rand(0,0.08);
 // occasional mistake: keep stale input
 if(Math.random()>0.82+p.skill*0.17)return;
 const hz=hazardsNow();
 let sx=0,sy=0;
 // dodge hazards (skill = reaction distance); never dodge your own hazard
 for(const h of hz){
  if(h.owner===p)continue;
  const fx=h.x+(h.vx||0)*0.35,fy=h.y+(h.vy||0)*0.35;
  const d=Math.hypot(p.x-fx,p.y-fy);
  const danger=(h.r||20)+p.r+40+p.skill*80;
  if(d<danger&&d>0.01){const w=(danger-d)/danger*3.2*(G.mode&&G.mode.dodgeMul||1);
   sx+=(p.x-fx)/d*w;sy+=(p.y-fy)/d*w;}
 }
 // avoid deadly edges (sometimes hugging corners like a dummy)
 if(G.mode&&G.mode.edge==='fall'&&Math.random()<0.65+p.skill*0.3){
  const m=62;
  if(p.x<T.x+m)sx+=1.6;if(p.x>T.x+T.w-m)sx-=1.6;
  if(p.y<T.y+m)sy+=1.6;if(p.y>T.y+T.h-m)sy-=1.6;
 }
 // objective
 const goal=(G.mode&&G.mode.botGoal)?G.mode.botGoal(p,hz):null;
 if(goal){const d=dist(p,goal);
  if(d>8){sx+=(goal.x-p.x)/d*1.1;sy+=(goal.y-p.y)/d*1.1;}}
 // ram nearby rivals for fun
 if(Math.hypot(sx,sy)<0.7&&Math.random()<0.4){
  let near=null,nd=200;
  for(const o of alivePlayers()){if(o===p)continue;const d=dist(p,o);if(d<nd){nd=d;near=o;}}
  if(near){sx+=(near.x-p.x)/nd*1.3;sy+=(near.y-p.y)/nd*1.3;}
 }
 const l=Math.hypot(sx,sy);
 if(l>0.05){p.botInput={x:sx/l,y:sy/l};}
 else p.botInput={x:0,y:0};
}

{id:'ketchup',name:"Ketchin' Up",desc:'Hide behind cover — dodge the sauce ray!',kind:'survival',edge:'fall',

 update(dt){const m=G.ms;m.t+=dt;
  m.spd=Math.min(2.2,0.55+m.t*0.05);
  m.angle+=m.spd*m.dir*dt;
  // the bottle wanders the table, slowly getting faster
  const b=m.bottle;
  if(Math.hypot(b.x-m.wx,b.y-m.wy)<26){m.wx=rand(T.x+170,T.x+T.w-170);m.wy=rand(T.y+120,T.y+T.h-120);}
  const ws=Math.min(95,30+m.t*3),wd=Math.hypot(m.wx-b.x,m.wy-b.y)||1;
  b.x+=(m.wx-b.x)/wd*ws*dt;b.y+=(m.wy-b.y)/wd*ws*dt;
  const ux=Math.cos(m.angle),uy=Math.sin(m.angle);
  for(const p of alivePlayers()){
   const dx=p.x-b.x,dy=p.y-b.y;
   const tp=dx*ux+dy*uy;
   if(tp<46)continue;
   const perp=Math.abs(dx*uy-dy*ux);
   if(perp<15+p.r*0.55){
    let blocked=false;
    for(const o of G.obstacles){if(o.kind==='bottle')continue;
     const ox=o.x-b.x,oy=o.y-b.y,to=ox*ux+oy*uy;
     if(to>30&&to<tp&&Math.abs(ox*uy-oy*ux)<o.r*0.95){blocked=true;break;}}
    if(!blocked){eliminate(p,'poof');SFX.splat();}}}
 },
 draw(l,t){if(l!=='over')return;const m=G.ms,b=m.bottle;
  const ux=Math.cos(m.angle),uy=Math.sin(m.angle);
  // find beam end (first blocker or table edge)
  let maxT=1400;
  if(ux!==0){for(const xx of[T.x,T.x+T.w]){const tt=(xx-b.x)/ux;if(tt>0)maxT=Math.min(maxT,tt);}}
  if(uy!==0){for(const yy of[T.y,T.y+T.h]){const tt=(yy-b.y)/uy;if(tt>0)maxT=Math.min(maxT,tt);}}
  for(const o of G.obstacles){if(o.kind==='bottle')continue;
   const ox=o.x-b.x,oy=o.y-b.y,to=ox*ux+oy*uy;
   if(to>30&&Math.abs(ox*uy-oy*ux)<o.r*0.95)maxT=Math.min(maxT,to);}
  ctx.strokeStyle='#d92b1e';ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.lineWidth=16-i*5;ctx.globalAlpha=0.35+i*0.3;
   ctx.beginPath();ctx.moveTo(b.x+ux*48,b.y+uy*48);
   const wob=Math.sin(t*14+i*2)*4;
   ctx.lineTo(b.x+ux*maxT-uy*wob,b.y+uy*maxT+ux*wob);ctx.stroke();}
  ctx.globalAlpha=1;
  circle(b.x+ux*maxT,b.y+uy*maxT,8+Math.sin(t*18)*2,'#d92b1e');

 hazards(){const m=G.ms,b=m.bottle,a=[];const look=0.42;

{id:'shotdog',name:'Shot Dog',desc:'Hot dogs auto-fire when lined up. Last one standing!',kind:'survival',edge:'wall',obsChance:0.85,
 init(){G.ms={dogs:[]};for(const p of G.players)p.fireCd=rand(1.6,2.8);},
 update(dt){const m=G.ms;
  const cone=G.time>20?0.45:0.262,reload=G.time>20?0.9:1.35;
  for(const p of alivePlayers()){p.fireCd-=dt;
   if(p.fireCd<=0){
    for(const o of alivePlayers()){if(o===p)continue;
     const a=Math.atan2(o.y-p.y,o.x-p.x);
     if(Math.abs(angDiff(a,p.dir))<cone){
      let blocked=false;
      if(G.time<28)for(const ob of G.obstacles){if(ob.push)continue;
       const to=(ob.x-p.x)*Math.cos(a)+(ob.y-p.y)*Math.sin(a);
       if(to>0&&to<dist(p,o)&&segPointDist(ob.x,ob.y,p.x,p.y,o.x,o.y)<ob.r)blocked=true;}
      if(!blocked){
       m.dogs.push({x:p.x+Math.cos(p.dir)*30,y:p.y+Math.sin(p.dir)*30,
        vx:Math.cos(p.dir)*465,vy:Math.sin(p.dir)*465,r:9,age:0,owner:p});
       p.fireCd=reload;SFX.shoot();shake(2);
       p.vx-=Math.cos(p.dir)*90;p.vy-=Math.sin(p.dir)*90;
       break;}}}}}
  for(let i=m.dogs.length-1;i>=0;i--){const d=m.dogs[i];d.age+=dt;
   d.x+=d.vx*dt;d.y+=d.vy*dt;
   if(d.age>4.5){m.dogs.splice(i,1);continue;}
   if(d.x<T.x+d.r){d.x=T.x+d.r;d.vx=Math.abs(d.vx);SFX.tick();}
   if(d.x>T.x+T.w-d.r){d.x=T.x+T.w-d.r;d.vx=-Math.abs(d.vx);SFX.tick();}
   if(d.y<T.y+d.r){d.y=T.y+d.r;d.vy=Math.abs(d.vy);SFX.tick();}
   if(d.y>T.y+T.h-d.r){d.y=T.y+T.h-d.r;d.vy=-Math.abs(d.vy);SFX.tick();}
   let dead=false;
   for(const ob of G.obstacles){
    const dd=Math.hypot(d.x-ob.x,d.y-ob.y);
    if(dd<d.r+ob.r){
     if(ob.push){ob.vx+=d.vx*0.35;ob.vy+=d.vy*0.35;puff(d.x,d.y,6,'#e8b364');dead=true;}
     else{const nx=(d.x-ob.x)/dd,ny=(d.y-ob.y)/dd;const vn=d.vx*nx+d.vy*ny;
      if(vn<0){d.vx-=2*vn*nx;d.vy-=2*vn*ny;}d.x=ob.x+nx*(d.r+ob.r);d.y=ob.y+ny*(d.r+ob.r);}
     break;}}
   if(dead){m.dogs.splice(i,1);continue;}
   for(const p of alivePlayers()){
    if(p===d.owner&&d.age<0.3)continue;
    if(Math.hypot(p.x-d.x,p.y-d.y)<p.r+d.r){eliminate(p,'poof');m.dogs.splice(i,1);break;}}}

{id:'crown',name:'King of the Meal',desc:'Hold the crown to fill your meter. Bump the king to steal it!',kind:'objective',edge:'wall',obsChance:0.6,

{id:'meat',name:'Nice To Meat You',desc:'Build momentum — smash rivals with your meatball!',kind:'survival',edge:'fall',barren:true,cap:40,dodgeMul:0.35,
 init(){G.ms={};for(const p of G.players){p.ball={x:p.x,y:p.y+70,px:p.x,py:p.y+70,r:14};}},
 update(dt){const L=88;
  // sudden death: lethal speed keeps dropping so late-round swings always finish it
  const LETHAL=G.time>20?Math.max(160,360-(G.time-20)*14):360;
  const alive=alivePlayers();
  for(const p of alive){const b=p.ball;
   // verlet integration
   const vx=(b.x-b.px)*0.995,vy=(b.y-b.py)*0.995;
   b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy;
   // chain constraint
   const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);
   if(d>L){const nx=dx/d,ny=dy/d;b.x=p.x+nx*L;b.y=p.y+ny*L;}
  }
  // ball vs ball
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
   const a=alive[i].ball,b=alive[j].ball;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;
   if(d<min&&d>0){const nx=dx/d,ny=dy/d,ov=(min-d)/2;
    a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;SFX.bump();}}
  // ball vs players
  for(const p of alive){const b=p.ball;
   const bvx=(b.x-b.px)/Math.max(dt,0.001),bvy=(b.y-b.py)/Math.max(dt,0.001);
   const bs=Math.hypot(bvx,bvy);
   for(const o of alivePlayers()){if(o===p)continue;
    const d=Math.hypot(o.x-b.x,o.y-b.y);
    if(d<o.r+b.r+6){
     if(bs>LETHAL){eliminate(o,'poof');SFX.splat();shake(8);
      addEffect({type:'text',x:o.x,y:o.y-30,txt:'SPLAT!',t:0,dur:0.7,col:'#e8402f'});}
     else if(d>0){const nx=(o.x-b.x)/d,ny=(o.y-b.y)/d; // heavy shove: ring-outs are a real kill path
      o.vx+=nx*Math.max(140,bs*0.85);o.vy+=ny*Math.max(140,bs*0.85);SFX.bump();}}}}

   const bs=Math.hypot(b.x-b.px,b.y-b.py)/0.0166;

//------------------------------------------------ ONLINE (WebRTC via PeerJS, host-authoritative — same design as Talhalla)
// Host runs the whole simulation; clients send input vectors and render snapshots.
let net=null;
let joinCode='',joinMode=false;
const netFx={sfx:[],fx:[]};
const FACES=['idle','panic','dead','smug','angry'];
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){let s='';for(let i=0;i<5;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}
// Two transports, raced in parallel, invisible to the player:
//  1. WebRTC (PeerJS) — direct, lowest latency; works when NATs cooperate.
//  2. MQTT over WSS via public brokers — plain outbound web traffic, works on ANY network
//     (CGNAT, hotspots, strict firewalls). Slightly higher latency; perfect fallback.
// Whichever delivers the lobby first wins; the other is torn down.

async function waitNetLibs(ms){
 const t0=Date.now();
 while(Date.now()-t0<ms&&typeof Peer==='undefined'&&typeof mqtt==='undefined')
  await new Promise(r=>setTimeout(r,150));
 const t1=Date.now(); // brief grace so the second lib can arrive too
 while(Date.now()-t1<1500&&(typeof Peer==='undefined'||typeof mqtt==='undefined'))
  await new Promise(r=>setTimeout(r,150));
 return typeof Peer!=='undefined'||typeof mqtt!=='undefined';
}

  {urls:'stun:stun.cloudflare.com:3478'},
 ];

   const url=rel.startsWith('http')?rel:
    'https://'+rel.split(':')[0]+'.metered.live/api/v1/turn/credentials?apiKey='+rel.split(':').slice(1).join(':');

   try{b.publish('ffz/'+net.code+'/c/'+d.cid,JSON.stringify({t:'full'}));}catch(e){}return;}
  rec=net.mqSeen[d.cid]={slot,last:Date.now(),b};

   send(m){try{rec.b.publish('ffz/'+net.code+'/c/'+d.cid,JSON.stringify(m));}catch(e){}}};

function clientTick(dt){
 for(const p of G.players){
  if(p.tx===undefined)continue;
  if(p.x===undefined){p.x=p.tx;p.y=p.ty;}
  p.tx+=p.vx*dt;p.ty+=p.vy*dt; // extrapolate between snapshots
  p.x=lerp(p.x,p.tx,0.45);p.y=lerp(p.y,p.ty,0.45);
  if(p.alive){
   p.trail.push({x:p.x,y:p.y});if(p.trail.length>13)p.trail.shift();
   const sp=Math.hypot(p.vx,p.vy),k=Math.min(sp/2400,0.07);
   p.sqx=lerp(p.sqx,1+k,0.25);p.sqy=lerp(p.sqy,1-k,0.25);
   p.lookX=lerp(p.lookX,p.vx/380,0.15);p.lookY=lerp(p.lookY,p.vy/380,0.15);}
 }
 for(const o of G.obstacles||[])if(o.tx!==undefined){o.x=lerp(o.x,o.tx,0.4);o.y=lerp(o.y,o.ty,0.4);}
 if(G.ms&&G.ms.saws)for(const s of G.ms.saws)s.rot+=dt*11;
 if(G.mode&&G.mode.id==='juice'&&G.phase==='play'&&G.ms&&G.ms.pc)
  for(const p of G.players)if(p.alive&&p.x!==undefined)G.mode.stamp(p.x,p.y,20,p);
 // send our input to the host (also serves as the in-game heartbeat)
 net.inT-=dt;
 if(net.inT<=0&&['game','score'].includes(G.screen)){
  net.inT=0.05;const i=localInput();

}

let forceModeId=null;
function startRound(){
 const pool=MODES.filter(m=>match.enabled[m.id]);
 let mode;
 if(forceModeId){mode=MODES.find(m=>m.id===forceModeId)||choice(pool);}
 else{do{mode=choice(pool);}while(pool.length>1&&mode===match.lastMode);}
 match.lastMode=mode;
 G.mode=mode;
 G.arena=mode.barren?ARENAS[0]:choice(ARENAS);
 resetPlayersRound();
 buildObstacles(G.arena,mode);
 G.ms=null;mode.init();
 G.time=0;G.phase='card';G.cardT=1.6;G.screen='game';G.roundWinners=[];
 G.roundN=(G.roundN||0)+1;
 SFX.spawn();
}
function endRound(winners){
 if(G.phase==='over')return;G.phase='over';
 G.roundWinners=winners;
 let humanWon=false;
 for(const p of winners){p.wins++;if(!p.bot)humanWon=true;}
 if(humanWon){SAVE.roundWins++;save();checkUnlocks();checkAch();}
 for(const p of G.players)p.face=winners.includes(p)?'smug':'angry';
 G.screen='score';G.scoreT=2.1;
 beep(winners.length?740:220,0.25,'square',0.12,winners.length?250:-80);
}
function afterScore(){
 const champ=G.players.find(p=>p.wins>=match.winsNeeded);
 if(champ){G.victor=champ;G.screen='victory';burstConfetti();jingle();
  if(!champ.bot){SAVE.matchWins++;
   const others=G.players.filter(p=>p!==champ).reduce((s,p)=>s+p.wins,0);
   save();checkAch();}
  return;}
 startRound();
}

//------------------------------------------------ game update & draw
function updateGame(dt){
 if(G.phase==='card'){G.cardT-=dt;if(G.cardT<=0)G.phase='play';return;}
 if(G.phase!=='play')return;
 G.time+=dt;
 for(const p of G.players){if(!p.alive)continue;if(p.bot)botThink(p,dt);}
 for(const p of G.players)if(p.alive)updatePlayerPhysics(p,dt);
 const alive=alivePlayers();
 for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++)bumpPlayers(alive[i],alive[j]);
 updateObstacles(dt);
 G.mode.update(dt);
 if(G.phase!=='play')return;
 // faces: panic near hazards
 const hz=hazardsNow();
 for(const p of alivePlayers()){
  let panic=false;
  for(const h of hz){if(Math.hypot(p.x-h.x,p.y-h.y)<(h.r||20)+95){panic=true;break;}}
  p.face=panic?'panic':'idle';
 }
 if(G.mode.kind==='survival'){
  const a=alivePlayers();
  if(a.length<=1)endRound(a);
  else if(G.time>(G.mode.cap||55))endRound(a); // safety cap: survivors share
 }
}

   ctx.fillText('◀ '+(KEYMAPS[i].label)+' ▶ to change',x+pw/2,y+272);
   if(s.pad!=null){ctx.fillStyle='#4fd455';ctx.fillText('🎮 Gamepad '+(s.pad+1),x+pw/2,y+298);}
   ctx.fillStyle='#4fd455';ctx.font='bold 26px "Comic Sans MS",sans-serif';ctx.fillText('READY!',x+pw/2,y+350);
   button(x+40,y+h-52,pw-80,36,'MAKE BOT',((idx)=>()=>{seats[idx].type='bot';seats[idx].pad=null;})(i),{size:16,col:'#8a7db0'});
   // char cycling
   const m=KEYMAPS[i];
   if(keyEdge[m.l]||(s.pad!=null&&padDirEdge(s.pad,'l'))){s.char=cycleChar(s.char,-1);SFX.ui();}
   if(keyEdge[m.r]||(s.pad!=null&&padDirEdge(s.pad,'r'))){s.char=cycleChar(s.char,1);SFX.ui();}
  }else if(s.type==='bot'){
   const ci=(Math.floor(t*0.8)+i*3)%CHARS.length;
   drawChar(CHARS[randBotCharPreview(i)].kind,x+pw/2,y+150,52,'idle',SEATCOL[i],t+i,1,1,0,0,0);
   ctx.fillStyle='#8a7db0';ctx.font='bold 30px "Comic Sans MS",sans-serif';ctx.fillText('BOT',x+pw/2,y+250);
   ctx.fillStyle='#ffffff66';ctx.font='16px "Comic Sans MS",sans-serif';
   ctx.fillText('Press '+KEYMAPS[i].label,x+pw/2,y+300);
   ctx.fillText('or a pad button to join',x+pw/2,y+324);
   button(x+40,y+h-52,pw-80,36,'REMOVE',((idx)=>()=>{seats[idx].type='off';})(i),{size:16,col:'#8a7db0'});
  }else{
   ctx.fillStyle='#3a2b52';ctx.font='bold 30px "Comic Sans MS",sans-serif';ctx.fillText('EMPTY',x+pw/2,y+250);
   ctx.fillStyle='#ffffff44';ctx.font='16px "Comic Sans MS",sans-serif';
   ctx.fillText('Press '+KEYMAPS[i].label+' to join',x+pw/2,y+300);
   button(x+40,y+h-52,pw-80,36,'ADD BOT',((idx)=>()=>{seats[idx].type='bot';})(i),{size:16,col:'#8a7db0'});
  }
  // join by key
  const m=KEYMAPS[i];
  if(s.type!=='human'&&(keyEdge[m.u]||keyEdge[m.d]||keyEdge[m.l]||keyEdge[m.r])){
   s.type='human';s.char=firstFreeChar();SFX.join();}
 }
 // pads: unclaimed pad presses a button → join; claimed pad: Ⓐ/Start = continue, Ⓑ = leave seat
 let padJoined=false;
 pads().forEach((gp,pi)=>{if(!gp)return;
  if(seats.some(s=>s.pad===pi&&s.type==='human'))return;
  for(const b of[0,1,2,3])if(padBtnEdge(pi,b)){
   for(const s of seats)if(s.type!=='human'){s.type='human';s.pad=pi;s.char=firstFreeChar();SFX.join();padJoined=true;return;}}});
 if(!padJoined)pads().forEach((gp,pi)=>{if(!gp)return;
  const seat=seats.find(s=>s.pad===pi&&s.type==='human');
  if(seat){
   if(padBtnEdge(pi,0)||padBtnEdge(pi,9)){trySettings();}
   else if(padBtnEdge(pi,1)){seat.type='bot';seat.pad=null;SFX.ui();}
  }else if(padBtnEdge(pi,1)){G.screen='title';}});
 ctx.fillStyle='#ffffff88';ctx.font='17px "Comic Sans MS",sans-serif';ctx.textAlign='center';
 ctx.fillText('Unlocked '+(6+SAVE.unlockCount)+'/'+CHARS.length+' characters — win rounds to unlock more!',W/2,H-118);
 button(W/2-300,H-84,280,56,'◀ TITLE',()=>{G.screen='title';});
 button(W/2+20,H-84,280,56,'NEXT ▶',()=>{trySettings();});
 drawButtons(t);
 if(keyEdge['Enter'])trySettings();
 if(keyEdge['Escape'])G.screen='title';
}
const botPrev=[randi(0,6),randi(0,6),randi(0,6),randi(0,6)];
function randBotCharPreview(i){return botPrev[i];}
function cycleChar(c,d){
 for(let k=0;k<CHARS.length;k++){c=(c+d+CHARS.length)%CHARS.length;if(charUnlocked(c))return c;}
 return c;
}
function trySettings(){
 let n=seats.filter(s=>s.type!=='off').length;
 if(n<2){ // need at least 2 — auto-add a bot
  for(const s of seats){if(s.type==='off'){s.type='bot';n++;if(n>=2)break;}}
  toast('Added a bot — you need at least 2 players!');
 }
 SFX.ui();G.screen='settings';
}
function drawSettings(t){
 ctx.fillStyle='#221533';ctx.fillRect(0,0,W,H);
 wtext('MATCH SETTINGS',W/2,66,50,['#ffd23f','#ff8c42'],t,'#3a2417');
 buttons=[];
 // wins needed
 ctx.fillStyle='#fff';ctx.font='bold 28px "Comic Sans MS",sans-serif';ctx.textAlign='center';
 ctx.fillText('Round wins to take the match:',W/2-80,140);
 button(W/2+120,112,44,40,'−',()=>{match.winsNeeded=Math.max(1,match.winsNeeded-1);},{size:24});
 ctx.fillStyle='#ffd23f';ctx.font='bold 40px "Comic Sans MS",sans-serif';
 ctx.fillText(match.winsNeeded,W/2+205,146);
 button(W/2+250,112,44,40,'+',()=>{match.winsNeeded=Math.min(25,match.winsNeeded+1);},{size:24});
 // minigame toggles
 ctx.fillStyle='#fff';ctx.font='bold 24px "Comic Sans MS",sans-serif';
 ctx.fillText('Minigame pool (click to toggle):',W/2,205);
 const cols=4,bw=250,bh=64,gx=W/2-(cols*bw+(cols-1)*16)/2;
 MODES.forEach((m,i)=>{
  const c=i%cols,r=Math.floor(i/cols);
  const x=gx+c*(bw+16),y=235+r*(bh+14);
  const on=match.enabled[m.id];
  button(x,y,bw,bh,'',()=>{
   const cnt=MODES.filter(mm=>match.enabled[mm.id]).length;
   if(on&&cnt<=1){toast('Keep at least one minigame!');return;}
   match.enabled[m.id]=!on;},{col:on?'#4fd455':'#5a4a72'});
 });
 drawButtons(t);
 // labels over the toggle buttons
 MODES.forEach((m,i)=>{
  const c=i%cols,r=Math.floor(i/cols);
  const x=gx+c*(bw+16),y=235+r*(bh+14);
  const on=match.enabled[m.id];
  ctx.fillStyle='#3a2417';ctx.font='bold 20px "Comic Sans MS",sans-serif';ctx.textAlign='center';
  ctx.fillText((on?'✓ ':'✗ ')+m.name,x+bw/2,y+28);
  ctx.font='12px "Comic Sans MS",sans-serif';
  ctx.fillText(m.kind==='survival'?'survival':(m.kind==='timed'?'timed':'objective'),x+bw/2,y+48);
 });
 buttons=[];
 button(W/2-300,H-84,280,56,'◀ BACK',()=>{G.screen='select';});
 button(W/2+20,H-84,280,56,'START! 🍴',()=>{startMatch();});
 drawButtons(t);
 if(padAnyDirEdge('l')){match.winsNeeded=Math.max(1,match.winsNeeded-1);SFX.ui();}
 if(padAnyDirEdge('r')){match.winsNeeded=Math.min(25,match.winsNeeded+1);SFX.ui();}
 if(keyEdge['Enter']||anyPadConfirm())startMatch();
 if(keyEdge['Escape']||anyPadBack())G.screen='select';
}

//------------------------------------------------ main loop
let last=0,manual=false;
function frame(dt){
 G.tGlobal+=dt;
 const t=G.tGlobal;
 pollPads();
 // music: gameplay theme in rounds/scoreboard, menu theme everywhere else
 musicPlay((G.screen==='game'||G.screen==='score')?'game':'menu');
 // M toggles music — but never while typing a room code (codes can contain "M"!)
 if(keyEdge['KeyM']&&!(G.screen==='online'&&joinMode)){
  SAVE.music=SAVE.music===false;save();toast(SAVE.music===false?'🔇 Music off':'🎵 Music on (M to toggle)');}
 // update
 if(net&&net.role==='client'){
  if(net.snap){applySnap(net.snap);net.snap=null;}
  if(['game','score','victory'].includes(G.screen)){
   clientTick(dt);
   if(keyEdge['Escape']||padAnyEdge(8)){netCleanup();G.screen='title';}
  }
 }else if(G.screen==='game'){updateGame(dt);
  if(keyEdge['Escape']||padAnyEdge(8)){
   if(net&&net.role==='host'){netBroadcast({t:'tolobby'});G.screen='netlobby';}
   else G.screen='title';}}
 else if(G.screen==='score'){G.scoreT-=dt;if(G.scoreT<=0)afterScore();}
 // host: broadcast snapshots at ~15Hz while the match runs
 if(net&&net.role==='host'&&['game','score','victory'].includes(G.screen)){
  net.snapT-=dt;
  if(net.snapT<=0){net.snapT=0.066;netBroadcast(buildSnap());}
 }
 updateFx(dt);
 // draw
 ctx.save();
 if(shakeAmt>0)ctx.translate(rand(-shakeAmt,shakeAmt),rand(-shakeAmt,shakeAmt));
 buttons=[];
 if(G.screen==='title')drawTitle(t);
 else if(G.screen==='select')drawSelect(t);
 else if(G.screen==='settings')drawSettings(t);
 else if(G.screen==='online')drawOnline(t);
 else if(G.screen==='netlobby')drawNetLobby(t);
 else if(G.screen==='game')drawGame(t);
 else if(G.screen==='score')drawScore(t);
 else if(G.screen==='victory')drawVictory(t);
 handleButtons();
 ctx.restore();
 drawToasts();
 // clear input edges
 for(const k in keyEdge)keyEdge[k]=false;
 mouse.click=false;
}
function raf(ts){
 if(!manual){
  const dt=Math.min(0.033,(ts-last)/1000||0.016);last=ts;
  try{frame(dt);}catch(e){console.error('frame error',e);} // one bad frame must never kill the loop
 }else last=ts;
 requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

//------------------------------------------------ dev/test hook
window.__ff={
 get G(){return G;},get seats(){return seats;},get match(){return match;},MODES,CHARS,SAVE,
 step(dt,n){manual=true;n=n||1;for(let i=0;i<n;i++)frame(dt||0.0166);},
 auto(){manual=false;},
 forceMode(id){forceModeId=id;},
 testRound(id,humans){
  // instant bot-only round of a given mode for automated testing
  for(let i=0;i<4;i++){seats[i].type=(humans&&i<humans)?'human':'bot';}
  forceModeId=id||null;
  startMatch();
  G.cardT=0.01;
  return G.mode.id;
 },
 endRound(w){endRound(w||[]);},
 screen(s){G.screen=s;},
 alive(){return alivePlayers().length;},
 get music(){return music;},
 // online internals for automated testing
 get net(){return net;},setNet(v){net=v;},
 startHost,startJoin,netStartMatch,netCleanup,buildSnap,applySnap,clientMsg,hostMsg,clientStartMatch,
};
